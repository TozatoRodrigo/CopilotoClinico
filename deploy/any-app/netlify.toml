# CC-336 — ANY App → Copiloto Clínico (https://copiloto.servidortozato.cloud). netlify.toml gerado por
# `pnpm any:redirects` a partir de src/shared/any-migration/any-redirects.ts
# (versão 1) do repositório do Copiloto. Não edite à mão: mude o mapa e gere de novo.
# Primeira regra que casa vence; a query string segue para o destino.

# Hub
[[redirects]]
  from = "/"
  to = "https://copiloto.servidortozato.cloud/ferramentas"
  status = 301
  force = true

# Login — sem sessão, o Copiloto leva ao próprio login
[[redirects]]
  from = "/login"
  to = "https://copiloto.servidortozato.cloud/ferramentas"
  status = 301
  force = true

# Calculadora de infusões — o ?drug= dos links do ANY segue na query e a tela de Infusões o aceita
[[redirects]]
  from = "/infusion"
  to = "https://copiloto.servidortozato.cloud/ferramentas/infusoes"
  status = 301
  force = true

