# HETRIN Ped — sem login e offline, como a equipe do hospital usa; a CC-337 decide o destino definitivo [provisório: decisão CC-337]
[[redirects]]
  from = "/hetrinped"
  to = "https://hetrinped.netlify.app/"
  status = 301
  force = true

# HETRIN Ped (arquivos) [provisório: decisão CC-337]
[[redirects]]
  from = "/hetrinped/*"
  to = "https://hetrinped.netlify.app/:splat"
  status = 301
  force = true

# Qualquer outro endereço — como o * do ANY, que levava ao hub
[[redirects]]
  from = "/*"
  to = "https://copiloto.servidortozato.cloud/ferramentas"
  status = 301
  force = true
