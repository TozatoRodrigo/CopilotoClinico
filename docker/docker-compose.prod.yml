# ── Copiloto Clínico — Production Docker Compose ────────────────────────────
# Deploy na VPS (Hostinger). Isolado de outros apps via nomes únicos (copiloto-*).
# Traefik roteia: copiloto.servidortozato.cloud/v1/* → API, /* → Web.
services:
  # ── PostgreSQL com pgvector ──────────────────────────────────────────────
  copiloto-db:
    image: pgvector/pgvector:pg16
    container_name: copiloto-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_OWNER_USER}
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD}
      POSTGRES_DB: copiloto_clinico
      POSTGRES_APP_USER: ${POSTGRES_APP_USER}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
    volumes:
      - copiloto_pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - copiloto-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d copiloto_clinico"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis (BullMQ queue) ─────────────────────────────────────────────────
  copiloto-redis:
    image: redis:7-alpine
    container_name: copiloto-redis
    restart: unless-stopped
    volumes:
      - copiloto_redis:/data
    networks:
      - copiloto-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Backend API (NestJS) ─────────────────────────────────────────────────
  copiloto-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: copiloto-api
    restart: unless-stopped
    depends_on:
      copiloto-db:
        condition: service_healthy
      copiloto-redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      API_PREFIX: v1
      CORS_ORIGIN: "*"
      DATABASE_URL: postgresql://${POSTGRES_APP_USER}:${POSTGRES_APP_PASSWORD}@copiloto-db:5432/copiloto_clinico?schema=public
      MIGRATION_DATABASE_URL: postgresql://${POSTGRES_OWNER_USER}:${POSTGRES_OWNER_PASSWORD}@copiloto-db:5432/copiloto_clinico?schema=public
      REDIS_URL: redis://copiloto-redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 7d
      # AI keys — placeholders; substituir quando tiver chaves reais
      AI_PROVIDER: ${AI_PROVIDER:-anthropic}
      AI_API_KEY: ${AI_API_KEY:-placeholder}
      AI_MODEL: ${AI_MODEL:-claude-sonnet-4-20250514}
      AI_BASE_URL: ${AI_BASE_URL:-}
      # Fase 0-B — ajustáveis sem rebuild, para o bake-off de modelos. Defaults
      # iguais aos do código; ver .env.example e docs/runbook.md.
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-16000}
      AI_EFFORT: ${AI_EFFORT:-high}
      AI_REASONING_EFFORT: ${AI_REASONING_EFFORT:-}
      AI_STRUCTURED_OUTPUT: ${AI_STRUCTURED_OUTPUT:-true}
      AI_OPENAI_STRUCTURED_OUTPUT: ${AI_OPENAI_STRUCTURED_OUTPUT:-false}
      AI_REFUSAL_FALLBACK: ${AI_REFUSAL_FALLBACK:-default}
      # Perfis de provedor (runbook, "Um provedor por etapa"). Só a Groq está
      # repassada; outro perfil precisa das mesmas linhas com o nome dele.
      # Lista vazia = só o AI_PROVIDER, como antes.
      AI_PROVIDER_PROFILES: ${AI_PROVIDER_PROFILES:-}
      AI_PROVIDER_GROQ_KIND: ${AI_PROVIDER_GROQ_KIND:-openai}
      AI_PROVIDER_GROQ_API_KEY: ${AI_PROVIDER_GROQ_API_KEY:-}
      AI_PROVIDER_GROQ_BASE_URL: ${AI_PROVIDER_GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      AI_PROVIDER_GROQ_STRUCTURED_OUTPUT: ${AI_PROVIDER_GROQ_STRUCTURED_OUTPUT:-}
      AI_PROVIDER_GROQ_MAX_TOKENS_PARAM: ${AI_PROVIDER_GROQ_MAX_TOKENS_PARAM:-}
      AI_PROVIDER_GROQ_EXTRA_BODY: ${AI_PROVIDER_GROQ_EXTRA_BODY:-}
      AI_REQUEST_TIMEOUT_MS: ${AI_REQUEST_TIMEOUT_MS:-180000}
      AI_STREAM_IDLE_TIMEOUT_MS: ${AI_STREAM_IDLE_TIMEOUT_MS:-60000}
      AI_REQUEST_MAX_RETRIES: ${AI_REQUEST_MAX_RETRIES:-2}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-placeholder}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-placeholder}
      WHISPER_PROVIDER: groq
      WHISPER_API_KEY: ${WHISPER_API_KEY:-placeholder}
      WHISPER_BASE_URL: https://api.groq.com/openai/v1
      # CC-205 — modelo da transcrição. Mesmo motivo das linhas abaixo: sem
      # repassar aqui, a troca no .env.production não chega ao container.
      WHISPER_MODEL: ${WHISPER_MODEL:-whisper-large-v3}
      INFERENCE_QUEUE_CONCURRENCY: "2"
      INFERENCE_QUEUE_RATE_PER_SEC: "10"
      COPILOT_MAX_TURNS: "5"
      # KB-005/KB-006 — piso de relevância do retrieval. Os defaults do código
      # (hybrid-search.ts) já são estes; o que estas linhas garantem é que o
      # valor seja AJUSTÁVEL sem rebuild. Sem elas, `RETRIEVAL_MIN_SEMANTIC_SCORE`
      # no .env.production não chega ao container, e o rollback documentado no
      # runbook ("=0 desliga o piso sem redeploy") simplesmente não funciona —
      # foi exatamente o que se descobriu no primeiro deploy desta feature.
      RETRIEVAL_MIN_SEMANTIC_SCORE: ${RETRIEVAL_MIN_SEMANTIC_SCORE:-0.3}
      RETRIEVAL_STRONG_SEMANTIC_SCORE: ${RETRIEVAL_STRONG_SEMANTIC_SCORE:-0.45}
      RETRIEVAL_MIN_KEYWORD_RANK: ${RETRIEVAL_MIN_KEYWORD_RANK:-0.01}
      # ADR-010 — base oficial do MS (PCDT/DDT/DB/PU). Mesmo motivo das linhas
      # acima: sem repassar aqui, "OFFICIAL_GUIDELINES_ENABLED=false" no
      # .env.production não desligaria nada. Defaults iguais aos do código
      # (official-search.ts), calibrados em produção em 24/09/2026.
      OFFICIAL_GUIDELINES_ENABLED: ${OFFICIAL_GUIDELINES_ENABLED:-true}
      OFFICIAL_MIN_SEMANTIC_SCORE: ${OFFICIAL_MIN_SEMANTIC_SCORE:-0.52}
      OFFICIAL_CHRONIC_PENALTY: ${OFFICIAL_CHRONIC_PENALTY:-0.10}
      OFFICIAL_MAX_CHUNKS_PER_DOCUMENT: ${OFFICIAL_MAX_CHUNKS_PER_DOCUMENT:-2}
      OFFICIAL_RETRIEVAL_TOP_K: ${OFFICIAL_RETRIEVAL_TOP_K:-3}
      # F0-C / ADR-012 — kill-switch da contenção de fonte não revisada. Mesmo
      # motivo das linhas acima: sem repassar aqui, "=false" no .env.production
      # não chegaria ao container. Default igual ao do código (ligado).
      UNREVIEWED_SOURCES_PRELIMINARY: ${UNREVIEWED_SOURCES_PRELIMINARY:-true}
      # F1 / ADR-013 — raciocínio em etapas (entender o caso antes de buscar).
      # legacy = pipeline de sempre; stages liga a Etapa 1 e a busca dirigida.
      # Mesmo motivo das linhas acima: sem repassar aqui, a troca no
      # .env.production não chega ao container. Modelo vazio = AI_MODEL.
      COPILOT_REASONING: ${COPILOT_REASONING:-legacy}
      AI_UNDERSTANDING_MODEL: ${AI_UNDERSTANDING_MODEL:-}
      AI_UNDERSTANDING_EFFORT: ${AI_UNDERSTANDING_EFFORT:-low}
      # ADR-014 — Copiloto guiado (perguntas antes do plano). off = direto ao
      # plano, como antes. Mesmo motivo das linhas acima. Modelo vazio = o da
      # Etapa 1.
      COPILOT_INTAKE: ${COPILOT_INTAKE:-off}
      AI_INTAKE_MODEL: ${AI_INTAKE_MODEL:-}
      # ADR-016 — modelo da decisão por gravidade. Vazio = AI_MODEL nas duas
      # rotas, como antes. Mesmo motivo das linhas acima.
      AI_DECISION_MODEL: ${AI_DECISION_MODEL:-}
      AI_DECISION_CRITICAL_MODEL: ${AI_DECISION_CRITICAL_MODEL:-}
      # F1 / ADR-013 PR 2 — decisão v2 e fonte de conhecimento (padrões = o
      # pipeline de hoje). Mesmo motivo das linhas acima. Domínios vazios =
      # lista padrão do código.
      COPILOT_DECISION_PROMPT: ${COPILOT_DECISION_PROMPT:-v1}
      COPILOT_KNOWLEDGE_SOURCE: ${COPILOT_KNOWLEDGE_SOURCE:-internal_kb}
      AI_RESEARCH_MODEL: ${AI_RESEARCH_MODEL:-claude-sonnet-5-5}
      AI_RESEARCH_EFFORT: ${AI_RESEARCH_EFFORT:-low}
      WEB_RESEARCH_MAX_SEARCHES: ${WEB_RESEARCH_MAX_SEARCHES:-5}
      WEB_RESEARCH_ALLOWED_DOMAINS: ${WEB_RESEARCH_ALLOWED_DOMAINS:-}
      # Emenda de 11/10/2026 ao ADR-013 — modelo que liga cada conduta a um
      # trecho na verificação com fonte (COPILOT_KNOWLEDGE_SOURCE=verify).
      # Mesmo motivo das linhas acima; padrão igual ao do código.
      AI_VERIFY_ATTACH_MODEL: ${AI_VERIFY_ATTACH_MODEL:-claude-sonnet-5-5}
      THROTTLER_TTL: ${THROTTLER_TTL:-60000}
      THROTTLER_LIMIT: ${THROTTLER_LIMIT:-600}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-text-embedding-3-small}
      LOG_LEVEL: info
    networks:
      - copiloto-net
      - proxy
    # Traefik: roteia /v1/* para o API
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.copiloto-api.rule=Host(`copiloto.servidortozato.cloud`) && PathPrefix(`/v1`)"
      - "traefik.http.routers.copiloto-api.entrypoints=websecure"
      - "traefik.http.routers.copiloto-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.copiloto-api.loadbalancer.server.port=3000"

  # ── Frontend (Next.js standalone) ────────────────────────────────────────
  copiloto-web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: copiloto-web
    restart: unless-stopped
    depends_on:
      - copiloto-api
    networks:
      - copiloto-net
      - proxy
    # Traefik: roteia /* para o Web (exceto /v1 que vai para o API)
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.copiloto-web.rule=Host(`copiloto.servidortozato.cloud`)"
      - "traefik.http.routers.copiloto-web.entrypoints=websecure"
      - "traefik.http.routers.copiloto-web.tls.certresolver=letsencrypt"
      - "traefik.http.routers.copiloto-web.priority=1"
      - "traefik.http.services.copiloto-web.loadbalancer.server.port=3000"

volumes:
  copiloto_pgdata:
  copiloto_redis:

networks:
  copiloto-net:
    driver: bridge
  proxy:
    external: true
