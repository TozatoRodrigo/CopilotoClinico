services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: copiloto-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_OWNER_USER:-copiloto_owner}
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:-copiloto_owner_dev}
      POSTGRES_DB: copiloto_clinico
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-copiloto_app_user}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-copiloto_app_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d copiloto_clinico"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: copiloto-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: copiloto-minio
    environment:
      MINIO_ROOT_USER: copiloto_minio_key
      MINIO_ROOT_PASSWORD: copiloto_minio_secret_change_me
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - backend
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # CC-203 / ADR-020 — modelo local de de-identificação. Opcional:
  # `docker compose --profile deid up -d deid` (o primeiro build baixa ~1 GB e
  # usa ~3 GB de RAM). A API local fala com ele com DEID_MODE=model e
  # DEID_SERVICE_URL=http://127.0.0.1:8099.
  deid:
    build:
      context: ..
      dockerfile: docker/Dockerfile.deid
    image: copiloto-deid:latest
    profiles: ["deid"]
    container_name: copiloto-deid
    ports:
      - "127.0.0.1:8099:8000"
    mem_limit: 400m

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  backend:
    driver: bridge
