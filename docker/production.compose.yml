services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - copiloto_postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - copiloto_redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - copiloto_minio_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    restart: "no"
    command: ["pnpm", "exec", "prisma", "migrate", "deploy"]
    env_file:
      - ${APP_ENV_FILE:-../.env.production}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-../.env.production}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - internal
      - traefik-public
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.http.routers.copiloto-api.rule=Host(`${API_HOST}`)
      - traefik.http.routers.copiloto-api.entrypoints=websecure
      - traefik.http.routers.copiloto-api.tls.certresolver=letsencrypt
      - traefik.http.services.copiloto-api.loadbalancer.server.port=3000
      - traefik.http.middlewares.copiloto-api-headers.headers.stsSeconds=31536000
      - traefik.http.middlewares.copiloto-api-headers.headers.stsIncludeSubdomains=true
      - traefik.http.routers.copiloto-api.middlewares=copiloto-api-headers

  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://${API_HOST}/v1
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      NEXT_PUBLIC_API_URL: https://${API_HOST}/v1
    depends_on:
      api:
        condition: service_started
    networks:
      - traefik-public
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.http.routers.copiloto-web.rule=Host(`${WEB_HOST}`)
      - traefik.http.routers.copiloto-web.entrypoints=websecure
      - traefik.http.routers.copiloto-web.tls.certresolver=letsencrypt
      - traefik.http.services.copiloto-web.loadbalancer.server.port=3001
      - traefik.http.middlewares.copiloto-web-headers.headers.stsSeconds=31536000
      - traefik.http.middlewares.copiloto-web-headers.headers.stsIncludeSubdomains=true
      - traefik.http.routers.copiloto-web.middlewares=copiloto-web-headers

networks:
  internal:
    driver: bridge
  traefik-public:
    external: true

volumes:
  copiloto_postgres_data:
  copiloto_redis_data:
  copiloto_minio_data:
