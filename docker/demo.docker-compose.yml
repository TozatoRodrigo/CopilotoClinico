services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: copiloto-demo-postgres
    environment:
      POSTGRES_DB: copiloto
      POSTGRES_USER: copiloto
      POSTGRES_PASSWORD: copiloto_demo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copiloto"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: copiloto-demo-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    container_name: copiloto-demo-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: copiloto-demo-backend
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://copiloto:copiloto_demo@postgres:5432/copiloto
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      JWT_ACCESS_SECRET: demo-secret-change-in-production-min-32-chars!!
      JWT_REFRESH_SECRET: demo-refresh-secret-change-in-production-min-32!!
      JWT_SECRET: demo-secret-change-in-production
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      NODE_ENV: production
      PORT: 3000
      CORS_ORIGIN: http://localhost:3001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "npx prisma migrate deploy && node dist/main.js"

  frontend:
    image: node:22-alpine
    container_name: copiloto-demo-frontend
    working_dir: /app
    ports:
      - "3001:3001"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000/v1
      PORT: 3001
    volumes:
      - ../web:/app
      - /app/node_modules
    command: sh -c "corepack enable && pnpm install && pnpm start -- -p 3001"
    depends_on:
      - backend

volumes:
  pgdata:
  miniodata:
