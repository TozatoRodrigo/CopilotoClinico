name: E2E (UI)

# F4 — Suites Playwright por perfil contra backend real (IA determinística).
# Workflow separado do ci.yml para não virar gate obrigatório imediatamente;
# pode ser adicionado aos required status checks quando estabilizar.
on:
  pull_request:
    branches: [codex/production-readiness]
  workflow_dispatch:

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://test:test@localhost:5432/test?schema=public
  JWT_ACCESS_SECRET: ci-test-access-secret-at-least-32-characters-long
  JWT_REFRESH_SECRET: ci-test-refresh-secret-at-least-32-characters-long
  JWT_ACCESS_EXPIRY: 15m
  JWT_REFRESH_EXPIRY: 7d
  AI_PROVIDER: test
  AI_API_KEY: dummy
  AI_MODEL: test
  AI_EMBEDDING_MODEL: test
  REDIS_URL: redis://localhost:6379
  INTERNAL_SERVICE_TOKEN: ci-internal-service-token-at-least-32-characters
  FIELD_ENCRYPTION_KEY: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
  NEXT_PUBLIC_API_URL: http://localhost:3000/v1

jobs:
  e2e-ui:
    name: Playwright E2E por perfil
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install backend deps
        run: pnpm install --frozen-lockfile

      - name: Install web deps
        run: pnpm install --frozen-lockfile
        working-directory: web

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Apply migrations
        run: pnpm prisma migrate deploy

      - name: Seed E2E users (per profile)
        run: pnpm seed:e2e

      - name: Build backend
        run: pnpm build

      - name: Build web
        run: pnpm build
        working-directory: web

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright suites
        run: pnpm e2e:ui

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
