name: CI

# OPS-002: Gates de CI — lint, typecheck, testes com cobertura e auditoria de
# dependências.
#
# Repositório privado no plano gratuito do GitHub: branch protection e
# rulesets não valem (a API responde 403). Até isso mudar, "merge só com CI
# verde" é regra do CONTRIBUTING.md, não da plataforma.
#
# Triggers: PRs e pushes para a main; workflow_dispatch roda o CI à mão em
# qualquer branch.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Push novo no mesmo PR cancela a execução anterior. Na main, cada push roda
# até o fim.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://test:test@localhost:5432/test?schema=public
  JWT_ACCESS_SECRET: ci-test-access-secret-at-least-32-characters-long
  JWT_REFRESH_SECRET: ci-test-refresh-secret-at-least-32-characters-long
  JWT_ACCESS_EXPIRY: 15m
  JWT_REFRESH_EXPIRY: 7d
  AI_PROVIDER: anthropic
  AI_API_KEY: test-key
  AI_MODEL: test-model
  AI_EMBEDDING_MODEL: test-embedding-model
  REDIS_HOST: localhost
  REDIS_PORT: 6379
  INTERNAL_SERVICE_TOKEN: ci-internal-service-token-at-least-32-characters
  FIELD_ENCRYPTION_KEY: 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'

jobs:
  # ──────────────────────────────────────────────────────────
  # Job 1: Backend Quality Gates
  # Lint → typecheck → testes com cobertura (limites em vitest.config.ts)
  # Não requer banco — usa mocks de Prisma.
  # ──────────────────────────────────────────────────────────
  quality:
    name: Backend Quality Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # CC-022: vulnerabilidade alta ou crítica nas dependências de produção da
      # API bloqueia o merge. As de desenvolvimento seguem no passo informativo.
      - name: Security Audit (produção)
        run: pnpm audit --prod --audit-level=high

      - name: Security Audit (todas as dependências, informativo)
        continue-on-error: true
        run: pnpm audit --audit-level=moderate

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Check for any
        run: |
          grep -r ': any' src/ --include='*.ts' && exit 1 || exit 0

      - name: Check for skipped tests
        run: |
          grep -rE 'it\.skip|test\.skip|xdescribe|TODO.*test' src/ --include='*.ts' && exit 1 || exit 0

      - name: Check for console.log
        run: |
          grep -r 'console\.log' src/ --include='*.ts' && exit 1 || exit 0

      - name: Validate Prisma schema
        run: pnpm exec prisma validate

      # Unit Tests WITH coverage — thresholds definidos em vitest.config.ts
      # (hoje 70% em branches, functions, lines e statements).
      # Falha se qualquer threshold não for atingido.
      - name: Unit Tests + Coverage
        run: pnpm test:cov

      - name: E2E Tests
        run: pnpm test:e2e

  # ──────────────────────────────────────────────────────────
  # Job 2: Frontend Quality Gates
  # Typecheck + lint + build do Next.js
  # ──────────────────────────────────────────────────────────
  web-quality:
    name: Frontend Quality Gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # CC-022: vulnerabilidade alta ou crítica no que vai para a imagem do web
      # bloqueia o merge. As de desenvolvimento seguem no passo informativo.
      - name: Security Audit (produção)
        run: pnpm audit --prod --audit-level=high

      - name: Security Audit (todas as dependências, informativo)
        continue-on-error: true
        run: pnpm audit --audit-level=moderate

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      # O Next 16 não tem mais `next lint`; o lint é o ESLint do web
      # (eslint.config.mjs). Erro reprova; aviso fica como aviso.
      - name: Lint
        run: pnpm lint

      - name: Check for Geist/Inter (A1 — identidade tipográfica Strivium)
        run: |
          grep -rEn 'Geist|next/font/google.{0,40}Inter|from "lucide-react"' src/ --include='*.ts' --include='*.tsx' && exit 1 || exit 0

      - name: Check contrast AA (A2 — paleta clínica)
        run: node scripts/check-contrast.mjs

      - name: Check for hardcoded colors in capture/result (A2 — design tokens)
        run: |
          grep -rEn '#[0-9a-fA-F]{3,8}|\b(red|blue|green|yellow|purple|pink|indigo|orange|amber|teal|cyan|emerald|rose|violet|fuchsia|lime|sky)-(50|100|200|300|400|500|600|700|800|900|950)\b' \
            src/app/\(app\)/encounters/\[id\]/capture/page.tsx \
            src/app/\(app\)/encounters/\[id\]/result/page.tsx \
            src/components/copilot/*.tsx \
            --include='*.tsx' && exit 1 || exit 0

      # A imagem do web (docker/Dockerfile.web) copia só web/: import de VALOR
      # de @contracts/* quebra o docker build com "Module not found", e o Build
      # abaixo não pega porque roda com o repositório inteiro.
      - name: Check @contracts só de tipo (imagem do web sem ../src)
        run: |
          pnpm exec vitest run scripts/check-contracts-type-only.test.mjs
          node scripts/check-contracts-type-only.mjs src

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000/v1

  # ──────────────────────────────────────────────────────────
  # Job 3: Integration Tests (requerem PostgreSQL real)
  # Testa comportamentos que só podem ser verificados contra
  # um banco real: triggers, constraints, hash chain, etc.
  # Roda APÓS quality para não desperdiçar créditos de CI.
  # ──────────────────────────────────────────────────────────
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: quality

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Apply Migrations
        run: pnpm prisma migrate deploy
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test?schema=public

      - name: Integration Tests
        run: pnpm test:integration
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test?schema=public
