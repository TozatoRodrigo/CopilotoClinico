name: Bug
description: Algo não funciona como deveria.
title: 'bug: '
labels: ['tipo: bug']
body:
  - type: markdown
    attributes:
      value: |
        Não cole dado de paciente: nome, prontuário, data de nascimento, CPF, telefone
        ou o texto de um caso real. Descreva com dados inventados.
        Vulnerabilidade de segurança não vira issue: siga o SECURITY.md.
  - type: textarea
    id: o-que-aconteceu
    attributes:
      label: O que aconteceu
      description: O que você fez e o que apareceu.
    validations:
      required: true
  - type: textarea
    id: o-que-deveria
    attributes:
      label: O que deveria acontecer
    validations:
      required: true
  - type: textarea
    id: como-reproduzir
    attributes:
      label: Como reproduzir
      description: Passos, com dados inventados.
      placeholder: |
        1. Abrir um atendimento novo
        2. Escrever o caso "…"
        3. …
    validations:
      required: true
  - type: dropdown
    id: onde
    attributes:
      label: Onde
      options:
        - Produção (copiloto.servidortozato.cloud)
        - Ambiente local
        - CI
    validations:
      required: true
  - type: input
    id: request-id
    attributes:
      label: x-request-id ou id do atendimento
      description: Se tiver. Ajuda a achar o log sem expor o caso.
  - type: textarea
    id: contexto
    attributes:
      label: Contexto
      description: Navegador, celular ou computador, perfil (médico, compliance, admin), captura de tela sem dado de paciente.
